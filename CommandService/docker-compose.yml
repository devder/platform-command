networks:
  default:
    name: les-network
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: les_command_service
    volumes:
      - .:/app
      - /app/bin
      - /app/obj
    ports:
      - "9090:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
